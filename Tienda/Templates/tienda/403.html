{% extends 'tienda/base.html' %}
{% load static %}
{% block title %} - Acceso denegado{% endblock %}
{% block content %}

<div class="error-403">
  <div class="error-403-icon">403</div>
  <h1>Acceso denegado</h1>
  <p>No tenés permisos para realizar esta acción. Necesitás una cuenta de administrador.</p>
  <a href="{% url 'inicio' %}" class="btn btn-primary">Volver al inicio</a>
</div>

<style>
.error-403 {
  text-align: center; padding: 80px 24px;
  max-width: 480px; margin: 0 auto;
}
.error-403-icon {
  font-family: 'Poppins', sans-serif;
  font-size: 5rem; font-weight: 700; color: #e8eaed; line-height: 1;
}
.error-403 h1 {
  font-family: 'Poppins', sans-serif;
  font-size: 1.6rem; font-weight: 700; color: #000; margin: 8px 0 12px;
}
.error-403 p { color: #5f6368; margin-bottom: 24px; }
</style>

{% endblock %}
